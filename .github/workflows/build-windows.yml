name: Build Windows installer

# Builds the Windows installer from the private source repo on this public
# repo's free runners, then attaches it to the given release here.
# Secrets are never available to fork PRs; triggers are owner-only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v1.4.2)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout private source at tag
        uses: actions/checkout@v4
        with:
          repository: GoblinsFarm/ClashOfClans-Bot
          token: ${{ secrets.SRC_REPO_TOKEN }}
          ref: ${{ inputs.tag }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller

      - name: Install system dependencies
        shell: pwsh
        run: |
          choco install ffmpeg tesseract innosetup -y --no-progress

      - name: Build installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          powershell -ExecutionPolicy Bypass -File build/build_windows.ps1

      - name: Attach installer to release
        env:
          GH_TOKEN: ${{ secrets.SRC_REPO_TOKEN }}
          GH_REPO: GoblinsFarm/goblinsfarm
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          exe=$(find . -name "*windows-installer.exe" | head -1)
          echo "Uploading: $exe"
          gh release upload "$TAG" "$exe" --clobber
